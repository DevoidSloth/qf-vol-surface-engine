[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vsepy"
version = "0.1.0"
description = "Arbitrage-free implied volatility surface and multi-model option pricing"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
# mpmath is not optional in spirit -- the accuracy audits and the generated
# reference values are the evidence behind every claim in benchmarks/ -- but it
# is not needed to price anything, so it lives here.
dev = ["pytest>=7", "hypothesis>=6", "mpmath>=1.3", "matplotlib>=3.6", "pandas>=1.5"]
data = ["yfinance>=0.2"]

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
vsepy = ["*.pyd", "*.so", "*.dylib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py39"
